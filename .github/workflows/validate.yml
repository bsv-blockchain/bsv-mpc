name: Validate patched Node builds
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify native runtime
        run: node -e "if(!['22.23.4','24.22.1'].includes(process.versions.node))throw Error(process.versions.node);const z=require('node:zlib');const b=Buffer.from('runtime');if(!z.brotliDecompressSync(z.brotliCompressSync(b)).equals(b))throw Error('Brotli');require('node:crypto').randomBytes(16)"
